name: Java CI with Maven and Test Coverage with JaCoCo

permissions:
  contents: write

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build_and_test_backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1 to checkout the code from the repository
      - uses: actions/checkout@v4
      
      # Step 2 to set up Java JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          # https://github.com/marketplace/actions/setup-java-jdk#supported-distributions
      
      # Step 3 to build the backend with Maven
      - name: Build
        working-directory: backend/
        run: mvn -B package --file pom.xml
    
      # Step 4 Test the Backend
      - name: Test
        working-directory: backend/
        run: mvn clean verify

      # Step 5: Upload JaCoCo Report
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco # Path to the HTML report directory
          
      # Step 6 Prepare Report
      - name: Prepare JaCoCo Report for Deployment
        run: |
          mkdir -p public
          cp -r backend/target/site/jacoco/* public/

      # Step 7: Install Doxygen and Generate Documentation
      - name: Install Doxygen and Graphviz
        run: sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen Documentation
        working-directory: backend/
        run: |
          doxygen Doxyfile

      # Step 8: Move Doxygen HTML Output to Public Directory
      - name: Prepare Doxygen Documentation for Deployment
        run: |
          mkdir -p public/doxygen
          cp -r backend/doc/html/* public/doxygen/

      # Step 9: List contents of public Folder
      - name: List public folder contents
        run: ls -R public/

      # Step 10: Deploy Jacoco Report to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true  # Deletes old files before deploying
          force: true  # Forces the push, avoiding locking issues
